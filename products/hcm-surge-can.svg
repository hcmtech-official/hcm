<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800">
  <defs>
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1616"/>
      <stop offset="12%" stop-color="#EF4444"/>
      <stop offset="30%" stop-color="#FF7A6E"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="88%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#6B0F0F"/>
    </linearGradient>
    <linearGradient id="canTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4E7EC"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="canBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
  </defs>

  <!-- can body -->
  <rect x="110" y="90" width="280" height="620" rx="26" fill="url(#canBody)"/>
  <!-- top rim -->
  <ellipse cx="250" cy="90" rx="140" ry="26" fill="url(#canTop)"/>
  <ellipse cx="250" cy="86" rx="118" ry="18" fill="#0B0D12"/>
  <ellipse cx="250" cy="82" rx="100" ry="13" fill="#3A3D46"/>
  <!-- bottom rim -->
  <ellipse cx="250" cy="710" rx="140" ry="24" fill="url(#canBottom)"/>

  <!-- label band -->
  <rect x="110" y="330" width="280" height="230" fill="#0B0D12" opacity="0.88"/>

  <!-- HCM orbit mark -->
  <g transform="translate(250,410)">
    <g stroke="#EEF0F4" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-42"/>
      <line x1="0" y1="0" x2="36" y2="21"/>
      <line x1="0" y1="0" x2="-36" y2="21"/>
    </g>
    <circle cx="0" cy="-42" r="9" fill="#EEF0F4"/>
    <circle cx="36" cy="21" r="9" fill="#EEF0F4"/>
    <circle cx="-36" cy="21" r="9" fill="#EEF0F4"/>
    <circle cx="0" cy="0" r="15" fill="#EEF0F4"/>
  </g>

  <text x="250" y="490" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="46" fill="#EEF0F4" letter-spacing="1">HCM SURGE</text>
  <text x="250" y="525" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#F87171" letter-spacing="3">SHIFT-LONG ENERGY</text>

  <text x="250" y="230" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#FFE4E1" letter-spacing="1">ZERO SUGAR · ZERO CRASH</text>
  <text x="250" y="640" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" fill="#FECACA" letter-spacing="2">MADE FOR THE WHOLE SHIFT</text>
</svg>
