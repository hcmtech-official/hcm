<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B88FF"/>
      <stop offset="50%" stop-color="#EEF0F4"/>
      <stop offset="100%" stop-color="#8B88FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5B57FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5B57FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="600" fill="#08090d"/>
  <circle cx="500" cy="260" r="380" fill="url(#glow)"/>

  <!-- fulcrum -->
  <polygon points="500,320 460,420 540,420" fill="#1c1f27" stroke="#2A2D36" stroke-width="3"/>
  <rect x="440" y="416" width="120" height="16" rx="6" fill="#1c1f27" stroke="#2A2D36" stroke-width="3"/>
  <circle cx="500" cy="312" r="12" fill="#EEF0F4"/>

  <!-- beam (level, in equilibrium) -->
  <rect x="150" y="300" width="700" height="10" rx="5" fill="url(#beamGrad)"/>

  <!-- left chain -->
  <line x1="220" y1="308" x2="220" y2="400" stroke="#4A4D57" stroke-width="3"/>
  <line x1="500" y1="308" x2="500" y2="360" stroke="#4A4D57" stroke-width="3" opacity="0"/>
  <!-- right chain -->
  <line x1="780" y1="308" x2="780" y2="400" stroke="#4A4D57" stroke-width="3"/>

  <!-- left pan: Courses -->
  <path d="M 150 400 Q 220 460 290 400" fill="none" stroke="#4A4D57" stroke-width="3"/>
  <ellipse cx="220" cy="404" rx="95" ry="26" fill="#15171C" stroke="#2A2D36" stroke-width="3"/>
  <g transform="translate(220,404)">
    <!-- graduation cap glyph -->
    <polygon points="-38,-8 0,-24 38,-8 0,8" fill="#8B88FF"/>
    <polygon points="-38,-8 0,8 0,26 -38,10" fill="#6D6AFF"/>
    <polygon points="38,-8 0,8 0,26 38,10" fill="#4038D6"/>
    <line x1="30" y1="-4" x2="30" y2="22" stroke="#EEF0F4" stroke-width="2.5"/>
    <circle cx="30" cy="24" r="4" fill="#EEF0F4"/>
  </g>
  <text x="220" y="470" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="26" fill="#EEF0F4">Courses</text>

  <!-- right pan: Launches -->
  <path d="M 710 400 Q 780 460 850 400" fill="none" stroke="#4A4D57" stroke-width="3"/>
  <ellipse cx="780" cy="404" rx="95" ry="26" fill="#15171C" stroke="#2A2D36" stroke-width="3"/>
  <g transform="translate(780,404)">
    <!-- lightbulb / creation glyph -->
    <circle cx="0" cy="-6" r="22" fill="#8B88FF"/>
    <rect x="-9" y="14" width="18" height="10" rx="3" fill="#6D6AFF"/>
    <line x1="-6" y1="28" x2="6" y2="28" stroke="#4038D6" stroke-width="3" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#EEF0F4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#EEF0F4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="780" y="470" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="26" fill="#EEF0F4">Launches</text>

  <!-- equals mark -->
  <text x="500" y="270" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="30" fill="#8B88FF" letter-spacing="2">EQUILIBRIUM</text>
</svg>
