<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A5D66"/>
      <stop offset="45%" stop-color="#2A2D36"/>
      <stop offset="100%" stop-color="#0F1116"/>
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A8D96" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3A3D46" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8A8D96" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f0f"/>
      <stop offset="55%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="glowBack" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="#08090d"/>
  <circle cx="450" cy="480" r="440" fill="url(#glowBack)"/>

  <!-- phone group, slight 3D tilt via skewY -->
  <g transform="translate(450,560) rotate(-4) skewY(2)" filter="url(#softShadow)">
    <!-- body -->
    <rect x="-220" y="-460" width="440" height="920" rx="58" fill="url(#frameGrad)"/>
    <rect x="-220" y="-460" width="440" height="920" rx="58" fill="none" stroke="url(#edgeHighlight)" stroke-width="4"/>
    <!-- side depth (fake 3D extrusion) -->
    <path d="M 220 -450 L 244 -430 L 244 430 L 220 450 Z" fill="#05060a" opacity="0.85"/>

    <!-- screen -->
    <rect x="-196" y="-430" width="392" height="860" rx="38" fill="url(#screenGrad)"/>

    <!-- camera dot -->
    <circle cx="0" cy="-402" r="7" fill="#3A3D46"/>

    <!-- HCM orbit mark -->
    <g transform="translate(0,-280) scale(1.3)">
      <g stroke="#EEF0F4" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-38"/>
        <line x1="0" y1="0" x2="33" y2="19"/>
        <line x1="0" y1="0" x2="-33" y2="19"/>
      </g>
      <circle cx="0" cy="-38" r="8" fill="#EEF0F4"/>
      <circle cx="33" cy="19" r="8" fill="#EEF0F4"/>
      <circle cx="-33" cy="19" r="8" fill="#EEF0F4"/>
      <circle cx="0" cy="0" r="13" fill="#EEF0F4"/>
    </g>

    <text x="0" y="-165" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="42" fill="#EEF0F4" letter-spacing="1">HCM EDGE</text>
    <text x="0" y="-125" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#F87171" letter-spacing="3">BUILT FOR THE GIG</text>

    <!-- "shift score" card -->
    <rect x="-160" y="-70" width="320" height="130" rx="20" fill="#15171C" stroke="#2A2D36" stroke-width="2"/>
    <text x="-135" y="-28" font-family="IBM Plex Mono" font-size="13" fill="#9AA0AD" letter-spacing="1">TODAY'S EDGE SCORE</text>
    <text x="-135" y="24" font-family="Bricolage Grotesque" font-weight="800" font-size="46" fill="#EEF0F4">82</text>
    <rect x="-135" y="42" width="270" height="8" rx="4" fill="#2A2D36"/>
    <rect x="-135" y="42" width="210" height="8" rx="4" fill="url(#barGrad)"/>

    <!-- alert card -->
    <rect x="-160" y="80" width="320" height="90" rx="20" fill="#1a0f0f" stroke="#7A1616" stroke-width="2"/>
    <text x="-135" y="112" font-family="IBM Plex Mono" font-size="12" fill="#FCA5A5" letter-spacing="1">PATTERN FLAGGED</text>
    <text x="-135" y="140" font-family="DejaVu Sans" font-size="15" fill="#EEF0F4">Low-fare zone, hour 9 — hold off</text>

    <!-- motivational line -->
    <text x="0" y="220" text-anchor="middle" font-family="Bricolage Grotesque" font-style="italic" font-weight="700" font-size="20" fill="#EEF0F4">"The house doesn't win today."</text>

    <!-- bottom nav dots -->
    <g fill="#4A4D57">
      <circle cx="-90" cy="380" r="8"/>
      <circle cx="-30" cy="380" r="8"/>
      <circle cx="30" cy="380" r="8" fill="#EF4444"/>
      <circle cx="90" cy="380" r="8"/>
    </g>

    <!-- home indicator -->
    <rect x="-70" y="418" width="140" height="6" rx="3" fill="#4A4D57"/>
  </g>

  <text x="450" y="1055" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="26" fill="#EEF0F4" letter-spacing="2">HCM EDGE — CONCEPT PHONE FOR GIG WORKERS</text>
</svg>