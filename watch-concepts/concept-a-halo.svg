<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="caseA" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5C5C66"/>
      <stop offset="100%" stop-color="#26262E"/>
    </radialGradient>
    <linearGradient id="glowA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B88FF"/>
      <stop offset="100%" stop-color="#5B57FF"/>
