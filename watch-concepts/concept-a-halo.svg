  <line x1="400.0" y1="42.0" x2="400.0" y2="62.0" stroke="#EEF0F4" stroke-width="10" stroke-linecap="round"/><line x1="579.0" y1="90.0" x2="569.0" y2="107.3" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="710.0" y1="221.0" x2="692.7" y2="231.0" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="758.0" y1="400.0" x2="738.0" y2="400.0" stroke="#EEF0F4" stroke-width="10" stroke-linecap="round"/><line x1="710.0" y1="579.0" x2="692.7" y2="569.0" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="579.0" y1="710.0" x2="569.0" y2="692.7" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="400.0" y1="758.0" x2="400.0" y2="738.0" stroke="#EEF0F4" stroke-width="10" stroke-linecap="round"/><line x1="221.0" y1="710.0" x2="231.0" y2="692.7" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="90.0" y1="579.0" x2="107.3" y2="569.0" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="42.0" y1="400.0" x2="62.0" y2="400.0" stroke="#EEF0F4" stroke-width="10" stroke-linecap="round"/><line x1="90.0" y1="221.0" x2="107.3" y2="231.0" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/><line x1="221.0" y1="90.0" x2="231.0" y2="107.3" stroke="#EEF0F4" stroke-width="5" stroke-linecap="round"/>

  <!-- dial -->
  <circle cx="400" cy="400" r="312" fill="#0B0D12"/>

  <!-- AI status halo (open arc, not a full ring — reads as "always thinking") -->
